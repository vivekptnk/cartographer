# XcodeGen mirror of CartographerDemo.xcodeproj.
#
# This file is advisory: the checked-in .xcodeproj is the source of truth
# xcodebuild consumes. Keep this file in sync on structural changes so
# reviewers can diff a 60-line YAML instead of a 600-line .pbxproj.
# See docs/adr/ADR-006-demo-app-structure.md.

name: CartographerDemo
options:
  bundleIdPrefix: com.garnathdynamics.cartographer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: 0.2.0
    CURRENT_PROJECT_VERSION: 1
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  Cartographer:
    path: ".."
targets:
  CartographerDemo:
    type: application
    platform: iOS
    sources:
      - CartographerDemo
    resources:
      - CartographerDemo/Resources/Assets.xcassets
    info:
      path: CartographerDemo/Info.plist
      properties:
        CFBundleShortVersionString: 0.2.0
        CFBundleVersion: 1
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.garnathdynamics.cartographer.demo
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: Cartographer
        product: Cartographer
    scheme:
      testTargets: []
      commandLineArguments: {}
schemes:
  CartographerDemo:
    build:
      targets:
        CartographerDemo: all
    run:
      config: Debug
    archive:
      config: Release
