<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <clipPath id="roundedPhone">
      <rect x="0" y="0" width="390" height="844" rx="40" ry="40"/>
    </clipPath>
  </defs>

  <!-- Phone body -->
  <rect x="0" y="0" width="390" height="844" rx="40" ry="40" fill="#1C1C1E"/>

  <!-- Screen area -->
  <rect x="0" y="0" width="390" height="844" rx="40" ry="40" fill="#F2F2F7" clip-path="url(#roundedPhone)"/>

  <!-- Status bar -->
  <rect x="0" y="0" width="390" height="54" fill="#F2F2F7"/>
  <text x="30" y="36" font-family="-apple-system, SF Pro Text, Helvetica" font-size="15" font-weight="600" fill="#1C1C1E">9:41</text>
  <!-- Signal / WiFi / Battery icons (simplified) -->
  <text x="310" y="36" font-family="-apple-system" font-size="13" fill="#1C1C1E">●●●  ▲  ▮▮</text>

  <!-- Dynamic Island -->
  <rect x="150" y="12" width="90" height="30" rx="15" ry="15" fill="#1C1C1E"/>

  <!-- Navigation bar -->
  <rect x="0" y="54" width="390" height="52" fill="#F2F2F7"/>
  <line x1="0" y1="106" x2="390" y2="106" stroke="#C6C6C8" stroke-width="0.5"/>
  <text x="195" y="84" font-family="-apple-system, SF Pro Text, Helvetica" font-size="17" font-weight="600" fill="#1C1C1E" text-anchor="middle">Cartographer Demo</text>
  <!-- Wrench button -->
  <text x="346" y="84" font-family="-apple-system" font-size="18" fill="#007AFF" text-anchor="middle">⚙</text>

  <!-- Map tiles background (simplified grid pattern) -->
  <rect x="0" y="106" width="390" height="690" fill="#E5E0D8"/>

  <!-- Map grid lines (tile grid simulation) -->
  <g stroke="#D4CDBF" stroke-width="0.5" opacity="0.6">
    <line x1="0" y1="200" x2="390" y2="200"/>
    <line x1="0" y1="300" x2="390" y2="300"/>
    <line x1="0" y1="400" x2="390" y2="400"/>
    <line x1="0" y1="500" x2="390" y2="500"/>
    <line x1="0" y1="600" x2="390" y2="600"/>
    <line x1="0" y1="700" x2="390" y2="700"/>
    <line x1="130" y1="106" x2="130" y2="796"/>
    <line x1="260" y1="106" x2="260" y2="796"/>
  </g>

  <!-- Streets (simplified) -->
  <g stroke="#FFFFFF" stroke-width="3" opacity="0.8">
    <line x1="0" y1="330" x2="390" y2="330"/>
    <line x1="0" y1="450" x2="390" y2="450"/>
    <line x1="0" y1="570" x2="390" y2="570"/>
    <line x1="100" y1="106" x2="100" y2="796"/>
    <line x1="195" y1="106" x2="195" y2="796"/>
    <line x1="290" y1="106" x2="290" y2="796"/>
  </g>

  <!-- Water feature (bay) -->
  <path d="M 0 680 Q 100 640 200 670 Q 280 695 390 660 L 390 796 L 0 796 Z" fill="#A8C4E0" opacity="0.7"/>

  <!-- Park area -->
  <rect x="60" y="200" width="120" height="100" fill="#B5D4A0" rx="4" opacity="0.8"/>

  <!-- Annotation pins -->
  <!-- Pin 1: Fisherman's Wharf area -->
  <g transform="translate(145, 310)">
    <circle cx="0" cy="-22" r="12" fill="#FF3B30"/>
    <polygon points="-5,0 5,0 0,12" fill="#FF3B30"/>
    <text x="0" y="-18" font-family="-apple-system" font-size="12" fill="white" text-anchor="middle" font-weight="bold">📍</text>
  </g>
  <text x="145" y="280" font-family="-apple-system, SF Pro Text" font-size="10" fill="#1C1C1E" text-anchor="middle" background="#FFF">Field Station A</text>

  <!-- Pin 2: Golden Gate area -->
  <g transform="translate(85, 250)">
    <circle cx="0" cy="-22" r="12" fill="#FF3B30"/>
    <polygon points="-5,0 5,0 0,12" fill="#FF3B30"/>
  </g>
  <text x="85" y="218" font-family="-apple-system, SF Pro Text" font-size="10" fill="#1C1C1E" text-anchor="middle">Survey Point 1</text>

  <!-- Pin 3 -->
  <g transform="translate(255, 380)">
    <circle cx="0" cy="-22" r="12" fill="#FF9500"/>
    <polygon points="-5,0 5,0 0,12" fill="#FF9500"/>
  </g>

  <!-- Pin 4 -->
  <g transform="translate(190, 480)">
    <circle cx="0" cy="-22" r="12" fill="#FF3B30"/>
    <polygon points="-5,0 5,0 0,12" fill="#FF3B30"/>
  </g>

  <!-- Pin 5 -->
  <g transform="translate(310, 290)">
    <circle cx="0" cy="-22" r="12" fill="#34C759"/>
    <polygon points="-5,0 5,0 0,12" fill="#34C759"/>
  </g>

  <!-- Pin 6 -->
  <g transform="translate(60, 400)">
    <circle cx="0" cy="-22" r="12" fill="#FF3B30"/>
    <polygon points="-5,0 5,0 0,12" fill="#FF3B30"/>
  </g>

  <!-- Cluster badge -->
  <circle cx="230" cy="540" r="18" fill="#007AFF"/>
  <text x="230" y="545" font-family="-apple-system" font-size="12" font-weight="700" fill="white" text-anchor="middle">+14</text>

  <!-- Compass -->
  <circle cx="356" cy="150" r="16" fill="white" opacity="0.9"/>
  <text x="356" y="154" font-family="-apple-system" font-size="11" fill="#FF3B30" text-anchor="middle">N</text>

  <!-- Scale bar -->
  <rect x="20" y="730" width="80" height="3" fill="#1C1C1E" opacity="0.7"/>
  <text x="20" y="745" font-family="-apple-system" font-size="10" fill="#1C1C1E" opacity="0.7">500 m</text>

  <!-- Status badge (bottom-right) -->
  <rect x="218" y="758" width="160" height="58" rx="10" ry="10" fill="rgba(255,255,255,0.85)"/>
  <text x="372" y="776" font-family="-apple-system, SF Pro Text" font-size="12" fill="#1C1C1E" text-anchor="end">6 annotations</text>
  <text x="372" y="793" font-family="-apple-system, SF Pro Text" font-size="11" fill="#6E6E73" text-anchor="end">sync: idle · pushed 0</text>
  <text x="372" y="808" font-family="-apple-system, SF Pro Text" font-size="10" fill="#6E6E73" text-anchor="end">Seeded 6 annotations</text>

  <!-- Home indicator -->
  <rect x="155" y="820" width="80" height="4" rx="2" ry="2" fill="#1C1C1E" opacity="0.3"/>
</svg>
