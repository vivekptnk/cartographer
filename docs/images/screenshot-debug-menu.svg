<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <clipPath id="roundedPhone2">
      <rect x="0" y="0" width="390" height="844" rx="40" ry="40"/>
    </clipPath>
  </defs>

  <!-- Phone body -->
  <rect x="0" y="0" width="390" height="844" rx="40" ry="40" fill="#1C1C1E"/>

  <!-- Screen -->
  <rect x="0" y="0" width="390" height="844" rx="40" ry="40" fill="#F2F2F7" clip-path="url(#roundedPhone2)"/>

  <!-- Status bar -->
  <rect x="0" y="0" width="390" height="54" fill="#FFFFFF"/>
  <text x="30" y="36" font-family="-apple-system, SF Pro Text, Helvetica" font-size="15" font-weight="600" fill="#1C1C1E">9:41</text>
  <text x="310" y="36" font-family="-apple-system" font-size="13" fill="#1C1C1E">●●●  ▲  ▮▮</text>

  <!-- Dynamic Island -->
  <rect x="150" y="12" width="90" height="30" rx="15" ry="15" fill="#1C1C1E"/>

  <!-- Navigation bar -->
  <rect x="0" y="54" width="390" height="52" fill="#FFFFFF"/>
  <line x1="0" y1="106" x2="390" y2="106" stroke="#C6C6C8" stroke-width="0.5"/>
  <text x="195" y="84" font-family="-apple-system" font-size="17" font-weight="600" fill="#1C1C1E" text-anchor="middle">Debug</text>
  <text x="355" y="84" font-family="-apple-system" font-size="17" fill="#007AFF" text-anchor="end">Done</text>

  <!-- Form background -->
  <rect x="0" y="106" width="390" height="738" fill="#F2F2F7"/>

  <!-- Section: Annotations -->
  <text x="20" y="136" font-family="-apple-system" font-size="13" fill="#6E6E73" font-weight="400">ANNOTATIONS</text>

  <rect x="0" y="146" width="390" height="132" fill="white"/>
  <line x1="20" y1="190" x2="390" y2="190" stroke="#C6C6C8" stroke-width="0.5"/>
  <line x1="20" y1="234" x2="390" y2="234" stroke="#C6C6C8" stroke-width="0.5"/>

  <!-- Stepper row -->
  <text x="20" y="172" font-family="-apple-system" font-size="17" fill="#1C1C1E">Seed count: 25</text>
  <rect x="300" y="155" width="72" height="30" rx="8" fill="#E5E5EA"/>
  <text x="316" y="175" font-family="-apple-system" font-size="20" fill="#1C1C1E">−</text>
  <line x1="336" y1="155" x2="336" y2="185" stroke="#C6C6C8" stroke-width="1"/>
  <text x="345" y="175" font-family="-apple-system" font-size="20" fill="#1C1C1E">+</text>

  <!-- Seed button -->
  <text x="20" y="217" font-family="-apple-system" font-size="17" fill="#007AFF">Seed 25 synthetic annotations</text>

  <!-- Clear button -->
  <text x="20" y="257" font-family="-apple-system" font-size="17" fill="#FF3B30">Clear all annotations</text>

  <!-- Section: Sync -->
  <text x="20" y="296" font-family="-apple-system" font-size="13" fill="#6E6E73">SYNC</text>

  <rect x="0" y="306" width="390" height="132" fill="white"/>
  <line x1="20" y1="350" x2="390" y2="350" stroke="#C6C6C8" stroke-width="0.5"/>
  <line x1="20" y1="394" x2="390" y2="394" stroke="#C6C6C8" stroke-width="0.5"/>

  <!-- Toggle row -->
  <text x="20" y="332" font-family="-apple-system" font-size="17" fill="#1C1C1E">CloudKit sync (in-memory)</text>
  <!-- Toggle switch (off state) -->
  <rect x="318" y="318" width="51" height="31" rx="15.5" fill="#E5E5EA"/>
  <circle cx="333" cy="333.5" r="13.5" fill="white" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.3))"/>

  <!-- Status row -->
  <text x="20" y="375" font-family="-apple-system" font-size="17" fill="#1C1C1E">Status</text>
  <text x="370" y="375" font-family="-apple-system" font-size="17" fill="#6E6E73" text-anchor="end">disabled</text>

  <!-- Trigger sync button -->
  <text x="20" y="415" font-family="-apple-system" font-size="17" fill="#C7C7CC">Trigger sync now</text>

  <!-- Section: Tiles -->
  <text x="20" y="456" font-family="-apple-system" font-size="13" fill="#6E6E73">TILES</text>

  <rect x="0" y="466" width="390" height="132" fill="white"/>
  <line x1="20" y1="510" x2="390" y2="510" stroke="#C6C6C8" stroke-width="0.5"/>
  <line x1="20" y1="554" x2="390" y2="554" stroke="#C6C6C8" stroke-width="0.5"/>

  <!-- Picker row -->
  <text x="20" y="492" font-family="-apple-system" font-size="17" fill="#1C1C1E">Source</text>
  <text x="370" y="492" font-family="-apple-system" font-size="17" fill="#6E6E73" text-anchor="end">OpenStreetMap  ›</text>

  <!-- Download button -->
  <text x="20" y="535" font-family="-apple-system" font-size="17" fill="#007AFF">Download current region (z 12–14)</text>

  <!-- Progress bar row -->
  <text x="20" y="578" font-family="-apple-system" font-size="17" fill="#1C1C1E">Download progress</text>
  <rect x="20" y="586" width="350" height="6" rx="3" fill="#E5E5EA"/>
  <rect x="20" y="586" width="245" height="6" rx="3" fill="#007AFF"/>

  <!-- Section: Export -->
  <text x="20" y="620" font-family="-apple-system" font-size="13" fill="#6E6E73">EXPORT</text>

  <rect x="0" y="630" width="390" height="44" fill="white"/>
  <text x="20" y="657" font-family="-apple-system" font-size="17" fill="#007AFF">Share GeoJSON</text>

  <!-- Last Action section -->
  <text x="20" y="694" font-family="-apple-system" font-size="13" fill="#6E6E73">LAST ACTION</text>
  <rect x="0" y="704" width="390" height="44" fill="white"/>
  <text x="20" y="730" font-family="-apple-system" font-size="14" fill="#6E6E73">Region download complete (247 tiles)</text>

  <!-- Home indicator -->
  <rect x="155" y="820" width="80" height="4" rx="2" ry="2" fill="#1C1C1E" opacity="0.3"/>
</svg>
